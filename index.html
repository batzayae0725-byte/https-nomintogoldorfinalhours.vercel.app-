<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="googleca2940f902d65ae2.html" />
    <title>Nominto Gold or Final Hours</title>
    <meta
      name="description"
      content="A simple static landing page for the Nominto Gold or Final Hours project."
    />
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --accent: #f59e0b;
        --text: #f8fafc;
        --muted: #cbd5e1;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: radial-gradient(circle at top, #1e293b 0%, var(--bg) 52%);
        color: var(--text);
      }

      main {
        width: min(90vw, 720px);
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 18px;
        padding: 3rem 2rem;
        box-shadow: 0 20px 45px rgba(15, 23, 42, 0.45);
      }

      .eyebrow {
        margin: 0 0 1rem;
        color: var(--accent);
        font-size: 0.78rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-weight: 700;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.2rem, 4vw, 4rem);
        line-height: 1.1;
      }

      p {
        color: var(--muted);
        font-size: 1.08rem;
        line-height: 1.7;
        margin: 1.1rem 0 0;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Project status</p>
      <h1>Nominto Gold or Final Hours</h1>
      <p>
        This static site is live and ready for the configured domain verification.
      </p>
    </main>
  </body>
</html>
